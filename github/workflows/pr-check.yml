name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Code Review with AI
        uses: ancin/happygitbot@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}