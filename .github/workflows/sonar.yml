name: SonarCloud Quality Check

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  sonar:
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build project
        run: mvn -B clean install -DskipTests

      - name: Run tests
        run: mvn test

      - name: Run Checkstyle (does not fail build)
        run: mvn -Dmaven.checkstyle.failOnViolation=false checkstyle:checkstyle

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=jose-matheusc_chatbot-ai
            -Dsonar.organization=jose-matheusc
            -Dsonar.java.binaries=target/classes
